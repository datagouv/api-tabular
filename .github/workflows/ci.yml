name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  CONTAINER_REGISTRY_SERVER: ${{ vars.CONTAINER_REGISTRY_SERVER }}
  CONTAINER_REGISTRY_NAMESPACE: ${{ vars.CONTAINER_REGISTRY_NAMESPACE }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Lint and format code and sort imports
        run: |
          uv run ruff check --extend-select I .
          uv run ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  build:
    needs: [lint, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the version is derived from the git tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compute the release version and build the wheel
        run: |
          RELEASE_VERSION=$(uvx --with hatch-vcs hatch version)
          echo "Building a wheel release with version $RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          # Docker tags allow only [a-zA-Z0-9_.-]; the version can be e.g. 0.4.2.dev5+gabc1234
          echo "DOCKER_TAG_VERSION=${RELEASE_VERSION//+/-}" >> "$GITHUB_ENV"
          uv build --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY_SERVER }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CONTAINER_REGISTRY_SERVER }}/${{ env.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.CONTAINER_NAME }}
          tags: |
            type=raw,value=${{ env.DOCKER_TAG_VERSION }}
            type=sha,format=short,prefix=
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ env.RELEASE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v10
      - name: Publish on PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
