[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "udata-hydra-csvapi"
dynamic = ["version"]
description = "Tabular API over Parquet resources, served by DuckDB"
authors = [
    {name = "data.gouv.fr", email = "opendatateam@data.gouv.fr"},
]
requires-python = ">=3.11,<3.15"
license = "MIT"
readme = "README.md"
dependencies = [
    "duckdb>=2.0",
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "pytz>=2026.5",
    "pyyaml>=6.0",
    "sentry-sdk>=2.20",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty>=0.0.90",
]

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["tabular_duckdb"]

[tool.ruff]
line-length = 100
lint = { extend-select = ["I"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
