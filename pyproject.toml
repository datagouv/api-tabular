[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabular-duckdb"
version = "1.0.0"
description = "Tabular API over Parquet resources, served by DuckDB"
requires-python = ">=3.11,<3.14"
license = "MIT"
readme = "README.md"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "sentry-sdk>=2.20",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["tabular_duckdb"]

[tool.ruff]
line-length = 100
lint = { extend-select = ["I"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
