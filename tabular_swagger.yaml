openapi: 3.0.3
info:
  title: data.gouv.fr Tabular API (DuckDB)
  description: |
    Access tabular data for data.gouv.fr resources as JSON. The data is read directly from
    the `<resource_id>.parquet` files stored in the S3 bucket, and queried by DuckDB.
    Supports pagination, filtering and sorting on columns. Use the resource's
    `/swagger/` endpoint to get the OpenAPI spec for its data and available filters,
    and the `/sql/` endpoint to run read-only SQL queries.
  version: 1.0.0
tags:
  - name: Data retrieval
    description: Retrieve data for resources
  - name: SQL
    description: Read-only SQL access
  - name: Health
    description: Service health
paths:
  /api/resources/{rid}/:
    get:
      tags:
        - Data retrieval
      description: Returns basic metadata and links to profile, data, OpenAPI spec and SQL endpoint for this resource.
      summary: Get resource metadata
      operationId: getMetaResourceInfo
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResourceInfo'
        404:
          description: Resource not found
      parameters:
      - description: UUID of the data.gouv.fr resource
        in: path
        name: rid
        required: true
        schema:
          type: string
          format: uuid
          example: "d5f400de-ae3f-4966-8cb6-a85c70c6c24a"
  /api/resources/{rid}/profile/:
    get:
      tags:
        - Data retrieval
      description: Returns column types and basic statistics for the tabular resource, derived from the parquet file.
      summary: Get resource profile
      operationId: getResourceProfile
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceProfileResponse'
        404:
          description: Resource not found
      parameters:
      - description: UUID of the data.gouv.fr resource
        in: path
        name: rid
        required: true
        schema:
          type: string
          format: uuid
          example: "d5f400de-ae3f-4966-8cb6-a85c70c6c24a"
  /api/resources/{rid}/swagger/:
    get:
      tags:
        - Data retrieval
      description: Returns the OpenAPI spec for this resource's data endpoints, including available columns and filter/sort operators.
      summary: Get resource OpenAPI spec
      operationId: getSwaggerResource
      responses:
        200:
          description: YAML-formatted OpenAPI spec for this resource's endpoints
        404:
          description: Resource not found
      parameters:
      - description: UUID of the data.gouv.fr resource
        in: path
        name: rid
        required: true
        schema:
          type: string
          format: uuid
          example: "d5f400de-ae3f-4966-8cb6-a85c70c6c24a"
  /api/resources/{rid}/data/:
    get:
      tags:
        - Data retrieval
      description: |
        Returns paginated tabular data as JSON. Columns and query params (filtering, sorting, page, page_size) depend on the resource.
        Use this resource's `/swagger/` endpoint for the full OpenAPI spec and available columns.
      summary: Get resource data (JSON)
      operationId: getResourceData
      responses:
        200:
          description: Paginated data (body has data, links, meta)
        400:
          description: Invalid query string
        404:
          description: Resource not found
      parameters:
      - description: UUID of the data.gouv.fr resource
        in: path
        name: rid
        required: true
        schema:
          type: string
          format: uuid
          example: "d5f400de-ae3f-4966-8cb6-a85c70c6c24a"
  /api/resources/{rid}/data/csv/:
    get:
      tags:
        - Data retrieval
      description: Same as `/data/` but returns CSV. See this resource's `/swagger/` for query params.
      summary: Get resource data (CSV)
      operationId: getResourceDataCsv
      responses:
        200:
          description: CSV stream
        403:
          description: Output is too long
        404:
          description: Resource not found
      parameters:
      - description: UUID of the data.gouv.fr resource
        in: path
        name: rid
        required: true
        schema:
          type: string
          format: uuid
          example: "d5f400de-ae3f-4966-8cb6-a85c70c6c24a"
  /api/resources/{rid}/data/json/:
    get:
      tags:
        - Data retrieval
      description: Same as `/data/` but streams JSON. See this resource's `/swagger/` for query params.
      summary: Get resource data (JSON stream)
      operationId: getResourceDataJson
      responses:
        200:
          description: JSON stream
        403:
          description: Output is too long
        404:
          description: Resource not found
      parameters:
      - description: UUID of the data.gouv.fr resource
        in: path
        name: rid
        required: true
        schema:
          type: string
          format: uuid
          example: "d5f400de-ae3f-4966-8cb6-a85c70c6c24a"
  /api/resources/{rid}/sql/:
    get:
      tags:
        - SQL
      description: |
        Runs a read-only SQL query against the resource, which is exposed as the table `resource`.
        For instance:
        `SELECT "Code du département" AS dep, count(*) AS n FROM resource GROUP BY 1 ORDER BY n DESC`.

        Only a single `SELECT` statement is accepted: any other statement (`CREATE`, `INSERT`,
        `COPY`, `ATTACH`, `SET`, `PRAGMA`, `INSTALL`...) and multiple statements are rejected.
        Results are capped and the query is interrupted after a timeout.
      summary: Run a read-only SQL query on the resource
      operationId: getResourceSql
      responses:
        200:
          description: Query result (body has data and meta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlResult'
        400:
          description: Invalid or rejected SQL query
        404:
          description: Resource not found
      parameters:
      - description: UUID of the data.gouv.fr resource
        in: path
        name: rid
        required: true
        schema:
          type: string
          format: uuid
          example: "d5f400de-ae3f-4966-8cb6-a85c70c6c24a"
      - description: The SQL query to run, the resource being the `resource` table
        in: query
        name: q
        required: true
        schema:
          type: string
          example: "SELECT count(*) AS n FROM resource"
  /api/aggregation-exceptions/:
    get:
      tags:
        - Data retrieval
      description: Kept for compatibility, aggregation queries (groupby, count, sum, etc.) are allowed on every resource.
      summary: List aggregation-allowed resources
      operationId: getAggregationExceptions
      responses:
        '200':
          description: Aggregation is allowed on every resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  exceptions:
                    type: array
                    items:
                      type: string
                      format: uuid
  /health/:
    get:
      tags:
        - Health
      description: Service health check (status, version, uptime). Checks both DuckDB and the S3 bucket.
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: DuckDB or the bucket is unavailable
components:
  schemas:
    ResourceProfileResponse:
      description: Profile endpoint response, derived from the parquet schema and statistics.
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/ResourceProfile'
        indexes:
          description: Always null in this architecture (no database index, the parquet file is scanned).
          type: array
          items:
            type: string
          nullable: true
    ResourceProfile:
      description: Column types and statistics derived from the parquet file
      type: object
      properties:
        header:
          description: Column names
          type: array
          items:
            type: string
        total_lines:
          description: Number of rows
          type: integer
        columns:
          description: Column type information (python_type and format)
          type: object
        formats:
          description: Column names grouped by detected format
          type: object
        profile:
          description: Per-column statistics (min, max, mean, std, nb_distinct, nb_missing_values)
          type: object
    MetaResourceInfo:
      description: Metadata and links for a resource
      type: object
      properties:
        created_at:
          description: Last modification date of the parquet file in the bucket
          type: string
        url:
          description: Always null in this architecture (the source file is not tracked)
          type: string
          nullable: true
        links:
          description: Links to profile, data, OpenAPI spec and SQL endpoints
          type: array
          items:
            type: object
            properties:
              href:
                description: URL of the endpoint
                type: string
              type:
                description: HTTP method (e.g. GET)
                type: string
              rel:
                description: Link relation (profile, data, swagger or sql)
                type: string
    SqlResult:
      description: Result of a read-only SQL query
      type: object
      properties:
        data:
          description: Result rows
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            table:
              description: Name under which the resource is exposed in the query
              type: string
            rows:
              description: Number of returned rows
              type: integer
            truncated:
              description: True when the row limit was reached
              type: boolean
            row_limit:
              description: Maximum number of rows returned
              type: integer
            execution_ms:
              description: Query duration in milliseconds
              type: integer
    Health:
      description: Health check response
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: Deployed app version
        uptime_since:
          type: string
          format: date-time
          description: ISO 8601 datetime of app startup
