services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/')"]
      interval: 5s
      timeout: 10s
      retries: 12
    environment:
      # a resource is read at <PARQUET_BASE_URL>/<resource_id>.parquet
      PARQUET_BASE_URL: ${PARQUET_BASE_URL:-https://hydra.s3.rbx.io.cloud.ovh.net/parquet}
      SERVER_NAME: ${SERVER_NAME:-localhost:8005}
      SCHEME: http
      DUCKDB_METADATA_CACHE: ${DUCKDB_METADATA_CACHE:-false}
      PROFILE_STATS: ${PROFILE_STATS:-true}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-10000}
      SQL_TIMEOUT: ${SQL_TIMEOUT:-30}
      # only needed for a private bucket
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
