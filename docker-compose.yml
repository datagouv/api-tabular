services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/')"]
      interval: 5s
      timeout: 10s
      retries: 12
    # passed through only when set: the defaults live in api_tabular/config.py
    environment:
      # a resource is read at <PARQUET_BASE_URL>/<resource_id>.parquet
      - PARQUET_BASE_URL
      - SERVER_NAME
      - SCHEME
      - DUCKDB_ENABLE_HTTP_METADATA_CACHE
      - PROFILE_STATS
      - QUERY_TIMEOUT_SECONDS
      - QUERY_WORKERS
