services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/')"]
      interval: 5s
      timeout: 10s
      retries: 12
    # passed through only when set: the defaults live in tabular_duckdb/config.py
    environment:
      # a resource is read at <PARQUET_BASE_URL>/<resource_id>.parquet
      - PARQUET_BASE_URL
      - SERVER_NAME
      - SCHEME
      - DUCKDB_METADATA_CACHE
      - PROFILE_STATS
      - QUERY_TIMEOUT
      - QUERY_WORKERS
      - SQL_MAX_ROWS
      - SQL_TIMEOUT
      # only needed for a private bucket
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_ENDPOINT
      - S3_REGION
