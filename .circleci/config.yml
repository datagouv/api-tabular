---
version: 2.1

parameters:
  python-version:
    type: string
    default: "3.14"
  publish-branch:
    type: string
    default: "main"
  container-registry-namespace:
    type: string
    default: "datagouv_api-tabular"
  docker-image-tabular:
    type: string
    default: "tabular-api"

jobs:
  lint:
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: uv sync --frozen
      - run:
          name: Lint and format code and sort imports
          # ruff check --extend-select I . : check linting and imports sorting without fixing (to fix, use --fix)
          # ruff format --check . : check code formatting without fixing (to fix, remove --check)
          command: |
            uv run ruff check --extend-select I .
            uv run ruff format --check .
      - run:
          name: Type check
          command: uv run ty check

  tests:
    # no infrastructure: the tests write their parquet files and serve them over HTTP themselves
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: uv sync --frozen
      - run:
          name: Run tests
          command: uv run pytest --junitxml=reports/python/tests.xml --color=yes
      - store_test_results:
          path: reports/python

  build:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Install uv and Python << pipeline.parameters.python-version >>
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv python install << pipeline.parameters.python-version >>
      - run:
          name: Compute RELEASE_VERSION from the git tags, and build wheel
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            git fetch --tags --force origin
            # hatch-vcs, configured in pyproject.toml, derives it from the last tag
            RELEASE_VERSION=$(uvx --with hatch-vcs hatch version)
            echo "Building a wheel release with version $RELEASE_VERSION"
            echo "Build number: $CIRCLE_BUILD_NUM"
            echo "Commit hash: ${CIRCLE_SHA1:0:7}"
            echo "Git tag: $CIRCLE_TAG"
            echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$BASH_ENV"
            uv build --wheel
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - pyproject.toml
      - run:
          name: Set image version
          command: echo "version=${CIRCLE_SHA1:0:7}" >> "$BASH_ENV"
      - run:
          name: Log in to container registry
          command: |
            : "${CONTAINER_REGISTRY_SERVER:?missing CONTAINER_REGISTRY_SERVER}"
            : "${CONTAINER_REGISTRY_USERNAME:?missing CONTAINER_REGISTRY_USERNAME}"
            : "${CONTAINER_REGISTRY_PASSWORD:?missing CONTAINER_REGISTRY_PASSWORD}"
            echo "${CONTAINER_REGISTRY_PASSWORD}" | docker login \
              -u "${CONTAINER_REGISTRY_USERNAME}" \
              --password-stdin "${CONTAINER_REGISTRY_SERVER}"
      - run:
          name: Build and push
          command: |
            source "$BASH_ENV"
            : "${CONTAINER_REGISTRY_SERVER:?missing CONTAINER_REGISTRY_SERVER}"
            repo="${CONTAINER_REGISTRY_SERVER}/<< pipeline.parameters.container-registry-namespace >>/<< pipeline.parameters.docker-image-tabular >>"
            DOCKER_TAG_GIT="${CIRCLE_TAG:-$(git describe --tags --exact-match 2>/dev/null || true)}"
            # the version comes from git tags, which are not in the build context
            docker build --build-arg VERSION="$RELEASE_VERSION" \
              -t "${repo}:${version}" \
              $([ "${CIRCLE_BRANCH:-}" = "main" ] && echo -t "${repo}:latest") \
              ${DOCKER_TAG_GIT:+-t "${repo}:${DOCKER_TAG_GIT}"} \
              .
            docker push "${repo}:${version}"
            if [ "${CIRCLE_BRANCH:-}" = "main" ]; then
              docker push "${repo}:latest"
            fi
            if [ -n "$DOCKER_TAG_GIT" ]; then
              docker push "${repo}:${DOCKER_TAG_GIT}"
            fi

  publish-pypi:
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie-slim
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publish on PyPI
          command: |
            uv publish  # use UV_PUBLISH_TOKEN

workflows:
  build-test-deploy:
    jobs:
      # Tag filters must be on every job in the chain, or tag pipelines skip dependents.
      - lint:
          filters:
            tags:
              only: /^v.+/
      - tests:
          filters:
            tags:
              only: /^v.+/
      - build:
          requires:
            - lint
            - tests
          filters:
            tags:
              only: /^v.+/
          context: org-global
      - publish-pypi:
          requires:
            - build
          filters:
            branches:
              only: << pipeline.parameters.publish-branch >>
          context: org-global
