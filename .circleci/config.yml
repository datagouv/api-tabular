---
version: 2.1

parameters:
  python-version:
    type: string
    default: "3.14"
  publish-branch:
    type: string
    default: "main"
  container-registry-namespace:
    type: string
    default: "datagouv_api-tabular"
  docker-image-tabular:
    type: string
    default: "tabular-api"
  docker-image-metrics:
    type: string
    default: "metric-api"

jobs:
  lint:
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: uv sync --frozen
      - run:
          name: Lint and format code and sort imports
          # ruff check --extend-select I . : check linting and imports sorting without fixing (to fix, use --fix)
          # ruff format --check . : check code formatting without fixing (to fix, remove --check)
          command: |
            uv run ruff check --extend-select I .
            uv run ruff format --check .
      - run:
          name: Type check
          command: uv run ty check

  tests:
    machine:
      image: ubuntu-2404:current  # Machine executor needed to run Docker containers (PostgreSQL + PostgREST)
    steps:
      - checkout
      - run:
          name: Start test containers
          command: |
            docker compose --profile test up -d
      - run:
          name: Wait for PostgreSQL to be ready
          command: |
            # Wait for PostgreSQL to be ready to accept connections
            timeout 60 bash -c 'until docker compose exec -T postgres-test pg_isready -U csvapi; do sleep 2; done'
      - run:
          name: Wait for PostgREST to be ready
          command: |
            # Wait for PostgREST to be ready
            timeout 30 bash -c 'until curl -f http://localhost:8080/ > /dev/null 2>&1; do sleep 2; done'
      - run:
          name: Install uv and dependencies and dev dependencies
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv python install << pipeline.parameters.python-version >>
            uv sync --frozen
      - run:
          name: Run tests
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run pytest --junitxml=reports/python/tests.xml -p no:sugar --color=yes
      - store_test_results:
          path: reports/python

  build:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Install uv and Python << pipeline.parameters.python-version >>
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv python install << pipeline.parameters.python-version >>
            uv sync --frozen
      - run:
          name: Compute RELEASE_VERSION via setuptools_scm, and build wheel
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            git fetch --tags --force origin
            # derive from setuptools_scm or base version + build number
            RELEASE_VERSION=$(uvx --from setuptools-scm python -m setuptools_scm)
            echo "Building a wheel release with version $RELEASE_VERSION"
            echo "Build number: $CIRCLE_BUILD_NUM"
            echo "Commit hash: ${CIRCLE_SHA1:0:7}"
            echo "Git tag: $CIRCLE_TAG"
            echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$BASH_ENV"
            uv build --wheel
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - pyproject.toml
      - run:
          name: Log in to Docker registry
          command: |
            : "${CONTAINER_REGISTRY_SERVER:?missing CONTAINER_REGISTRY_SERVER}"
            : "${CONTAINER_REGISTRY_USERNAME:?missing CONTAINER_REGISTRY_USERNAME}"
            : "${CONTAINER_REGISTRY_PASSWORD:?missing CONTAINER_REGISTRY_PASSWORD}"
            echo "${CONTAINER_REGISTRY_PASSWORD}" | docker login \
              -u "${CONTAINER_REGISTRY_USERNAME}" \
              --password-stdin "${CONTAINER_REGISTRY_SERVER}"
      - run:
          name: Build and push Docker images (Tabular API and Metrics API)
          command: |
            source "$BASH_ENV"
            : "${CONTAINER_REGISTRY_SERVER:?missing CONTAINER_REGISTRY_SERVER}"
            IMAGE_PREFIX="${CONTAINER_REGISTRY_SERVER}/<< pipeline.parameters.container-registry-namespace >>"
            REPO_TABULAR="${IMAGE_PREFIX}/<< pipeline.parameters.docker-image-tabular >>"
            REPO_METRICS="${IMAGE_PREFIX}/<< pipeline.parameters.docker-image-metrics >>"
            # Five distinct tags per image (SCM version, SHA short/long, branch, optional git tag (always v-prefixed, e.g. v0.4.1)).
            # Docker tags allow only [a-zA-Z0-9_.-]; setuptools_scm can output e.g. 0.4.0.dev5+gabc1234
            DOCKER_TAG_SCM=$(echo "$RELEASE_VERSION" | tr '+' '-')
            DOCKER_TAG_SHA_SHORT="${CIRCLE_SHA1:0:7}"
            DOCKER_TAG_SHA_LONG="$CIRCLE_SHA1"
            # CIRCLE_BRANCH is often empty on tag pipelines; skip an invalid empty Docker tag.
            DOCKER_TAG_BRANCH=$(printf '%s' "${CIRCLE_BRANCH:-}" | tr '/' '-' | sed 's/[^a-zA-Z0-9_.-]/-/g')
            DOCKER_TAG_GIT="${CIRCLE_TAG:-$(git describe --tags --exact-match 2>/dev/null || true)}"
            build_and_push() {
              local app_module="$1"
              local repo="$2"
              docker build --build-arg APP_MODULE="$app_module" \
                -t "${repo}:${DOCKER_TAG_SCM}" \
                -t "${repo}:${DOCKER_TAG_SHA_SHORT}" \
                -t "${repo}:${DOCKER_TAG_SHA_LONG}" \
                ${DOCKER_TAG_BRANCH:+-t "${repo}:${DOCKER_TAG_BRANCH}"} \
                ${DOCKER_TAG_GIT:+-t "${repo}:${DOCKER_TAG_GIT}"} \
                .
              docker push "${repo}:${DOCKER_TAG_SCM}"
              docker push "${repo}:${DOCKER_TAG_SHA_SHORT}"
              docker push "${repo}:${DOCKER_TAG_SHA_LONG}"
              if [ -n "$DOCKER_TAG_BRANCH" ]; then
                docker push "${repo}:${DOCKER_TAG_BRANCH}"
              fi
              if [ -n "$DOCKER_TAG_GIT" ]; then
                docker push "${repo}:${DOCKER_TAG_GIT}"
              fi
            }
            build_and_push api_tabular.tabular.app:app_factory "$REPO_TABULAR"
            build_and_push api_tabular.metrics.app:app_factory "$REPO_METRICS"

  publish-pypi:
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie-slim
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publish on PyPI
          command: |
            uv publish --username "${PYPI_USERNAME}" --password "${PYPI_PASSWORD}"

workflows:
  build-test-deploy:
    jobs:
      # Tag filters must be on every job in the chain, or tag pipelines skip dependents.
      - lint:
          filters:
            tags:
              only: /^v.+/
      - tests:
          filters:
            tags:
              only: /^v.+/
      - build:
          requires:
            - lint
            - tests
          filters:
            tags:
              only: /^v.+/
          context: org-global
      - publish-pypi:
          requires:
            - build
          filters:
            branches:
              only: << pipeline.parameters.publish-branch >>
          context: org-global
